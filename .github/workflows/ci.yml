name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-offline-gate:
    name: full-offline-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install development dependencies
        run: uv sync --dev

      - name: Run the full offline gate
        run: uv run python scripts/verify.py --profile full
